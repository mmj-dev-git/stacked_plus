name: flutter_base
description: A Stacked-based Flutter starter project.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  # Core Flutter
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Stacked
  stacked: ^3.5.0
  stacked_services: ^1.6.0

  # Firebase
  firebase_analytics: ^12.4.2
  firebase_core: ^4.10.0
  firebase_crashlytics: ^5.2.3

  # Localization and flavors
  flutter_flavor: ^3.1.4
  intl: ^0.20.2
  intl_utils: ^2.8.8

  # State, data, and models
  freezed: ^2.5.2
  freezed_annotation: ^2.4.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.5

  # Validation and permissions
  form_validation: ^3.2.0
  permission_handler: ^12.0.3

  # Utilities
  async: ^2.13.1
  connectivity_plus: ^6.1.5
  device_preview: ^1.2.0
  package_info_plus: ^10.1.0

  # Development workflow
  flutter_launcher_icons: ^0.14.4
  hive_generator: ^2.0.1
  hive_test: ^1.0.1
  husky: ^0.1.7
  melos: ^7.1.1
  network_image_mock: ^2.1.1
  total_lints: ^3.11.0
  change_app_package_name: ^1.5.0

dev_dependencies:
  # Code generation
  build_runner: ^2.4.13
  stacked_generator: ^1.6.1

  # Lints
  flutter_lints: ^6.0.0

  # Testing
  flutter_test:
    sdk: flutter
  golden_toolkit: ^0.15.0
  mockito: ^5.4.4


flutter:
  uses-material-design: true

